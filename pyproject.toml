[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patrol"
version = "0.2.1"
description = "网络设备巡检助手 - SSH 巡检、结果分析与报告生成"
requires-python = ">=3.10"
dependencies = [
    "netmiko>=4.3.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "textfsm>=1.1.3",
    "fastapi>=0.110.0,<0.116",
    "uvicorn>=0.27.0,<0.31",
    "python-docx>=1.1.0",
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "pysnmp>=6.2,<7",
    "python-multipart>=0.0.9,<0.0.13",
    "httpx>=0.27.0,<0.28",
    "openpyxl>=3.1.0",
    "urllib3>=2.0",
    "pillow>=10.0,<12",
    # PDF 导出在本机调用 Word 所需;缺失时只能退回 LibreOffice(多数用户未安装)
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.17",
]

[project.scripts]
patrol = "patrol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# 只拦"真正的错误":语法错误与未定义名。未使用导入之类的存量较多,不作卡点。
select = ["E9", "F63", "F7", "F82"]
