[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patrol"
version = "0.1.0"
description = "网络设备巡检助手 - SSH 巡检、结果分析与报告生成"
requires-python = ">=3.10"
dependencies = [
    "netmiko>=4.3.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "textfsm>=1.1.3",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-docx>=1.1.0",
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "pysnmp>=6.2,<7",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "urllib3>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
patrol = "patrol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
