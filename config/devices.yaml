# 设备清单(演示样例)——首次使用请替换为你的设备
# 也可在软件「设备管理」页面增删,或用「批量导入」导入 Excel 台账。
#
# 字段说明:
#   name            设备名称(报告中展示)
#   host            管理 IP
#   vendor / device_type  厂商与设备类型(支持见 README 设备支持表)
#   username / password   登录凭据(请自行修改)
#   login_method    ssh / web / api
#   timeout / command_timeout  连接超时(秒) / 命令执行超时(秒)
#   enabled         是否启用(定时巡检只跑启用设备)
devices:
- name: 核心交换机-示例
  host: 192.168.1.10
  vendor: h3c
  device_type: comware_switch
  username: admin
  password: your_password_here
  login_method: ssh
  port: 22
  timeout: 30
  command_timeout: 120
  enabled: true
- name: 汇聚交换机-示例
  host: 192.168.1.20
  vendor: huawei
  device_type: vrp_switch
  username: admin
  password: your_password_here
  login_method: ssh
  port: 22
  timeout: 30
  command_timeout: 60
  enabled: true
