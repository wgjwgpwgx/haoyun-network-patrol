{% extends "base.html" %}
{% block title %}查看报告 - 昊云网络巡检助手{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0"><i class="bi bi-file-earmark-text"></i> {{ filename }}</h5>
    <div class="d-flex gap-2">
        <a href="/ui/reports/{{ filename }}/download" class="btn btn-primary btn-sm"><i class="bi bi-download"></i> 下载</a>
        <a href="/ui/reports" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> 返回</a>
    </div>
</div>
<div class="card">
    <div class="card-body p-0">
        <iframe src="/reports/{{ filename }}" style="width:100%; height:calc(100vh - 200px); border:none; border-radius:8px;"></iframe>
    </div>
</div>
{% endblock %}
