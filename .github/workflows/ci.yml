name: CI

# 每次推送 main 与每个 PR 都跑:静态检查 + 三平台测试。
# 发版(推送 v* 标签)见 release.yml——那边在同样的测试通过后才构建安装包。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.17"
      - name: 静态检查(语法错误与未定义名)
        run: ruff check src tests scripts packaging

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # 三平台同一条命令:非 Windows 不收集桌面用例由 tests/conftest.py 按平台决定。
      # 不要在命令行写 --ignore=tests/test_desktop:测试会切换工作目录,而 pytest 8.x
      # 的 --ignore 在收集阶段按当时的工作目录解析,写了也不生效。
      - name: 运行测试
        run: python -m pytest -q
