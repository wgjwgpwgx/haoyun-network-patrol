name: Release

# 发版流程:推送 v* 标签触发
#   三平台测试 → 构建安装包 → 成品冒烟 → 全部通过后才上传到 GitHub Release。
# 成品冒烟与源码测试互补,只回答"解压后的程序能不能真用":
#   Windows:桌面窗口构建 + 全链路(模拟设备 → 命令行巡检 + 网页端巡检)
#   Linux:放进同代 glibc 的干净容器里跑全链路
# 冒烟不过,新版本就不会对外可见。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # 与 ci.yml 一致:非 Windows 不收集桌面用例由 tests/conftest.py 按平台决定,
      # 不要在命令行写 --ignore=tests/test_desktop(测试切换工作目录后不生效)
      - name: 运行测试
        run: python -m pytest -q

  windows-package:
    needs: test
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"  # CI 英文 Windows 控制台默认 cp1252,中文输出会 UnicodeEncodeError
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller
      - run: python packaging/build_portable.py
      - name: 冻结冒烟(桌面窗口构建、六面板遍历、服务层可达)
        run: python scripts/smoke_desktop_frozen.py
      - name: 全链路冒烟(模拟设备 → 命令行巡检 + 网页端巡检)
        run: python scripts/smoke_portable_e2e.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/*.zip
          if-no-files-found: error

  # 信创 Linux 绿色包:manylinux_2_28 容器(glibc 2.28 基线,与银河麒麟 V10 /
  # 统信 UOS 同代;亦满足 CI node24 运行时要求)构建,双架构 x86_64 + aarch64(飞腾/鲲鹏)。
  # 产物与打包脚本共用 packaging/patrol_portable.spec(与 Windows 包同一份数据文件与
  # 动态导入模块清单),下面只负责提供构建环境。
  linux-package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64
            mamba: linux-64
          - os: ubuntu-24.04-arm
            arch: aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64
            mamba: linux-aarch64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    env:
      PY: /opt/env/bin/python
    steps:
      - run: git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
      - uses: actions/checkout@v4
      # manylinux 自带 /opt/python 为静态构建(无 libpython.so,PyInstaller 不支持),
      # 用 micromamba 装 conda-forge 的 shared Python
      - name: 安装 shared Python 3.12(micromamba)
        run: |
          curl -Ls https://micro.mamba.pm/api/micromamba/${{ matrix.mamba }}/latest | tar -xj -C /tmp
          /tmp/bin/micromamba create -y -p /opt/env python=3.12
      - name: 安装依赖与 PyInstaller
        run: $PY -m pip install -e . pyinstaller
      - name: 构建 Linux 绿色包
        run: $PY packaging/build_portable_linux.py --arch ${{ matrix.arch }}
      # 附件里只放安装包本身(平铺):发布 job 按通配符取文件,放进别的文件会让路径错位
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # 冒烟不在构建容器里做:构建容器自带整套运行库,在那里能跑不代表用户机器能跑。
  # 程序放进 rockylinux:8(glibc 2.28,与目标系统同代,不含任何构建环境)里实跑;
  # 模拟设备起在宿主机上,容器以 --network host 连回来。
  linux-smoke:
    needs: linux-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      # 取内置模拟设备的源码(只用标准库,无需安装依赖)
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist
      - name: 在同代 glibc 的干净容器里实跑
        run: >
          python3 scripts/smoke_portable_e2e.py
          dist/haoyun-patrol-v*-linux-${{ matrix.arch }}.tar.gz --image rockylinux:8

  publish:
    needs: [windows-package, linux-smoke]
    runs-on: ubuntu-latest
    permissions:
      # 上传 Release 附件需要写权限(默认 GITHUB_TOKEN 只读);
      # 只给这一个 job,测试与构建 job 均为只读
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # 上传步骤对"通配符没匹配到文件"默认不报错:缺了包就会发出一个不完整的版本
      - name: 三个平台的安装包必须齐全
        run: |
          ls -la dist
          test "$(ls dist/*.zip dist/*.tar.gz | wc -l)" -eq 3
      - uses: actions/checkout@v4  # 取上传脚本
      # 只往事先建好的草稿 Release 上传附件,不改变草稿状态:附件与发布说明要人工核对后再生效。
      # (softprops/action-gh-release 未显式指定时会直接把草稿发布出去,v0.2.1 就是这样提前上线的)
      - name: 上传到草稿 Release
        run: python3 scripts/upload_release_assets.py "$TAG" dist/*.zip dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
