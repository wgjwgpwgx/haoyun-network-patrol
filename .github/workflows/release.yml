name: Release

# 发版流程:推送 v* 标签触发
#   三平台测试 → 构建安装包 → 冻结冒烟(Windows 桌面窗口 / Linux 在同代 glibc
#   的干净容器里拉起 Web 服务) → 全部通过后才上传到 GitHub Release。
# 冒烟不过,新版本就不会对外可见。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: 运行测试(全量)
        if: matrix.os == 'windows-latest'
        run: python -m pytest -q
      - name: 运行测试(跳过桌面 Tk 用例)
        if: matrix.os != 'windows-latest'
        run: python -m pytest -q --ignore=tests/test_desktop

  windows-package:
    needs: test
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"  # CI 英文 Windows 控制台默认 cp1252,中文输出会 UnicodeEncodeError
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller
      - run: python packaging/build_portable.py
      - name: 冻结冒烟(桌面窗口构建、六面板遍历、服务层可达)
        run: python scripts/smoke_desktop_frozen.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/*.zip
          if-no-files-found: error

  # 信创 Linux 绿色包:manylinux_2_28 容器(glibc 2.28 基线,与银河麒麟 V10 /
  # 统信 UOS 同代;亦满足 CI node24 运行时要求)构建,双架构 x86_64 + aarch64(飞腾/鲲鹏)。
  linux-package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64
            mamba: linux-64
          - os: ubuntu-24.04-arm
            arch: aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64
            mamba: linux-aarch64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    env:
      PY: /opt/env/bin/python
    steps:
      - run: git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
      - uses: actions/checkout@v4
      # manylinux 自带 /opt/python 为静态构建(无 libpython.so,PyInstaller 不支持),
      # 用 micromamba 装 conda-forge 的 shared Python
      - name: 安装 shared Python 3.12(micromamba)
        run: |
          curl -Ls https://micro.mamba.pm/api/micromamba/${{ matrix.mamba }}/latest | tar -xj -C /tmp
          /tmp/bin/micromamba create -y -p /opt/env python=3.12
      - name: 安装依赖与 PyInstaller
        run: $PY -m pip install -e . pyinstaller
      - name: 构建 Linux 绿色包
        run: $PY packaging/build_portable_linux.py --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            packaging/smoke_linux_portable.sh
          if-no-files-found: error

  # 冒烟不在构建容器里做:构建容器自带整套运行库,在那里能跑不代表用户机器能跑。
  # rockylinux:8 的 glibc 为 2.28,与目标系统同代,且不含任何构建环境。
  linux-smoke:
    needs: linux-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    container: rockylinux:8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: /tmp/pkg
      - name: 在同代 glibc 的干净环境里实跑
        run: bash /tmp/pkg/smoke_linux_portable.sh /tmp/pkg/haoyun-patrol-v*-linux-${{ matrix.arch }}.tar.gz

  publish:
    needs: [windows-package, linux-smoke]
    runs-on: ubuntu-latest
    permissions:
      # 上传 Release 附件需要写权限(默认 GITHUB_TOKEN 只读);
      # 只给这一个 job,测试与构建 job 均为只读
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist && rm -f dist/*.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
