name: Release

# 发版流程:推送 v* 标签(或网页 Draft release 建标签)自动触发
# 三平台跑测试 → Windows 构建绿色包 → 自动挂到 GitHub Release
on:
  push:
    tags: ["v*"]

# 上传 Release 附件需要 contents 写权限(默认 GITHUB_TOKEN 只读会报
# "Resource not accessible by integration")
permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: 运行测试(全量)
        if: matrix.os == 'windows-latest'
        run: python -m pytest -q
      - name: 运行测试(跳过桌面 Tk 用例)
        if: matrix.os != 'windows-latest'
        run: python -m pytest -q --ignore=tests/test_desktop

  windows-package:
    needs: test
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"  # CI 英文 Windows 控制台默认 cp1252,中文输出会 UnicodeEncodeError
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller
      - run: python packaging/build_portable.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  # 信创 Linux 绿色包:manylinux_2_28 容器(glibc 2.28 基线,与银河麒麟 V10 /
  # 统信 UOS 同代;亦满足 CI node24 运行时要求)构建,双架构 x86_64 + aarch64(飞腾/鲲鹏)。
  # manylinux 容器自带 /opt/python 多版本解释器,无需 setup-python。
  linux-package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    env:
      PY: /opt/python/cp312-cp312/bin/python
    steps:
      - run: git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
      - uses: actions/checkout@v4
      - name: 安装依赖与 PyInstaller
        run: $PY -m pip install -e . pyinstaller
      - name: 构建 Linux 绿色包
        run: $PY packaging/build_portable_linux.py --arch ${{ matrix.arch }}
      - name: 容器内冒烟(同 glibc 基线环境实跑二进制)
        run: |
          tar xzf dist/haoyun-patrol-v*-linux-${{ matrix.arch }}.tar.gz -C /tmp
          /tmp/haoyun-patrol/patrol-assistant --help
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
